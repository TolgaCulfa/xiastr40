<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XiasCloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #000000;
    --bg-mid: #060608;
    --nebula-violet: #3a1a5e;
    --nebula-cyan: #12525c;
    --star: #ffffff;
    --text-dim: #8c8c9c;
    --accent: #6fd8ea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-deep);
    overflow: hidden;
  }
  body {
    font-family: 'Manrope', sans-serif;
    color: var(--star);
    position: relative;
    width: 100%;
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .nebula {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 55% 40% at 22% 28%, rgba(58,26,94,0.4), transparent 60%),
      radial-gradient(ellipse 45% 35% at 78% 68%, rgba(18,82,92,0.22), transparent 60%),
      radial-gradient(ellipse 35% 30% at 60% 15%, rgba(111,216,234,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    mix-blend-mode: screen;
  }

  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vw 6vw calc(6vw + env(safe-area-inset-bottom, 0px));
  }

  .eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    letter-spacing: 0.35em;
    color: var(--accent);
    margin: 0 0 1.6rem;
    text-transform: uppercase;
    opacity: 0.85;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 4.2rem);
    line-height: 1.12;
    margin: 0;
    max-width: 16ch;
    letter-spacing: -0.01em;
    text-shadow: 0 0 30px rgba(125, 216, 232, 0.35), 0 0 90px rgba(91, 42, 143, 0.4);
  }

  h1 span {
    background: linear-gradient(100deg, #ffffff 20%, var(--accent) 55%, #b98cf0 85%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    margin: 1.8rem 0 0;
    max-width: 42ch;
    font-weight: 300;
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    color: var(--text-dim);
    line-height: 1.6;
  }

  .orbit {
    position: absolute;
    border: 1px solid rgba(157, 138, 222, 0.14);
    border-radius: 50%;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .drift { animation: drift 14s ease-in-out infinite; }
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="nebula"></div>

<main>
  <p class="eyebrow drift">Merhaba, uzaylı ziyaretçi</p>
  <h1>Bu site <span>XiasCloud</span> ile güçlendirilmiştir</h1>
  <p class="sub">Yıldızların arasından size ulaşan bu sayfa, sonsuz uzayın sessizliğinde parlıyor.</p>
</main>

<script>
(function () {
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d', { alpha: true });
  var stars = [];
  var STAR_COUNT = 110;
  var w, h, dpr;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = 1; // sabit çözünürlük: yüksek DPR ekranlarda gereksiz yeniden çizimi önler
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeStars() {
    var count = w < 600 ? Math.round(STAR_COUNT * 0.6) : STAR_COUNT;
    stars = [];
    for (var i = 0; i < count; i++) {
      var twinkles = Math.random() < 0.6; // çoğu yıldız hafifçe titrer
      var depth = Math.random(); // 0: uzak/yavaş, 1: yakın/hızlı -> paralaks hissi
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: depth * 1.1 + 0.3,
        baseAlpha: Math.random() * 0.5 + 0.35,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.015 + 0.006,
        twinkles: twinkles,
        drift: (depth * 0.12 + 0.02), // px/frame cinsinden yavaş kayma
        hue: Math.random() < 0.15 ? '111,216,234' : '255,255,255'
      });
    }
  }

  function drawStatic() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + s.hue + ',' + s.baseAlpha + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var lastFrame = 0;
  var FRAME_INTERVAL = 1000 / 24; // 24 fps yeterli, gereksiz GPU/CPU yükünü azaltır
  var running = true;

  function draw(now) {
    if (!running) return;
    requestAnimationFrame(draw);
    if (now - lastFrame < FRAME_INTERVAL) return;
    lastFrame = now;

    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = s.baseAlpha;
      if (s.twinkles) {
        alpha = s.baseAlpha + Math.sin(now * s.speed * 0.05 + s.phase) * 0.35;
        alpha = alpha < 0.1 ? 0.1 : (alpha > 1 ? 1 : alpha);
      }

      s.y += s.drift;
      if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }

      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + s.hue + ',' + alpha + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running && !reduceMotion) requestAnimationFrame(draw);
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      makeStars();
      if (reduceMotion) drawStatic();
    }, 150);
  });

  resize();
  makeStars();
  if (reduceMotion) {
    drawStatic();
  } else {
    requestAnimationFrame(draw);
  }
})();
</script>

</body>
</html>
